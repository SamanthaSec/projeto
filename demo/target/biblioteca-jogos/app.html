<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acervo • Arquivo Paranormal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="marca">
      <svg viewBox="0 0 100 100" fill="none" stroke="#c1121f" stroke-width="4">
        <circle cx="50" cy="50" r="44"/><path d="M50 22 L74 64 L26 64 Z"/><circle cx="50" cy="50" r="7" fill="#c1121f"/>
      </svg>
      <div><h2 class="titulo glitch">Arquivo Paranormal</h2><small>Acervo de jogos</small></div>
    </div>
    <div><span class="agente" id="user"></span><button class="btn sm ghost" id="sair">Sair</button></div>
  </div>

  <div class="stats">
    <div class="stat ficha"><small>Registros</small><b id="sTotal">0</b></div>
    <div class="stat ficha"><small>Valor do acervo</small><b id="sValor">R$ 0,00</b></div>
    <div class="stat ficha"><small>Preço médio</small><b id="sMedia">R$ 0,00</b></div>
    <div class="stat ficha"><small>Categorias</small><b id="sCats">0</b></div>
  </div>

  <div class="bar">
    <input id="busca" placeholder="Buscar por título ou gênero...">
    <select id="filtro"><option value="">Todas as plataformas</option></select>
    <button class="btn sm" id="novo">+ Novo registro</button>
  </div>
  <div class="chips" id="chips"></div>

  <div class="tbl ficha">
    <table>
      <thead><tr><th>Título</th><th>Categoria</th><th>Plataforma</th><th>Gênero</th><th>Preço</th><th></th></tr></thead>
      <tbody id="corpo"></tbody>
    </table>
    <div class="empty" id="vazio" style="display:none">Nenhum registro encontrado. Clique em “+ Novo registro”.</div>
  </div>
</div>

<!-- janela: jogo -->
<div class="modal" id="modal" style="display:none">
  <form class="box ficha" id="form">
    <h3 class="titulo" id="mTitulo">Novo registro</h3>
    <label>Título</label><input id="fTitulo" required>
    <label>Categoria</label><select id="fCat"></select>
    <div class="row2">
      <div><label>Plataforma</label><input id="fPlat" list="plats" required></div>
      <div><label>Gênero</label><input id="fGen"></div>
    </div>
    <datalist id="plats"><option>PC</option><option>PlayStation 5</option><option>Xbox Series</option><option>Nintendo Switch</option><option>Mobile</option></datalist>
    <label>Preço (R$)</label><input id="fPreco" type="number" step="0.01" min="0" required>
    <div class="row2" style="margin-top:24px">
      <button type="button" class="btn ghost" id="cancelar" style="margin:0">Cancelar</button>
      <button class="btn" type="submit" style="margin:0">Salvar</button>
    </div>
  </form>
</div>

<!-- janela: categorias -->
<div class="modal" id="modalCats" style="display:none">
  <div class="box ficha">
    <h3 class="titulo">Minhas categorias</h3>
    <p class="mut" style="font-size:13px;margin-top:6px">Crie as categorias que quiser para organizar o seu acervo.</p>
    <div id="listaCats" style="margin:14px 0"></div>
    <form id="formCat">
      <label>Nome da categoria</label><input id="cNome" maxlength="40" placeholder="Ex.: Terror, Zerados, Quero jogar" required>
      <label>Cor</label><input id="cCor" type="color" value="#c1121f">
      <div class="sugestoes" id="sugestoes"></div>
      <div class="row2" style="margin-top:20px">
        <button type="button" class="btn ghost" id="fecharCats" style="margin:0">Fechar</button>
        <button class="btn" type="submit" id="cBtn" style="margin:0">Criar categoria</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script>
let jogos = [], cats = [], editJogo = null, editCat = null, filtroCat = '';
const SUGESTOES = [['Sangue','#c1121f'],['Morte','#7d7d7d'],['Conhecimento','#d4a017'],['Energia','#8b4dff'],['Medo','#e9e1d3'],['Zerados','#3fae5b'],['Jogando','#2f8fd8'],['Quero jogar','#e0762b']];
const catPorId = id => cats.find(c => c.id === id);

function contar(el, alvo, fmt) {
  const ini = performance.now();
  (function f(t) {
    const p = Math.min((t - ini) / 600, 1);
    el.textContent = fmt(alvo * p);
    if (p < 1) requestAnimationFrame(f);
  })(ini);
}

async function iniciar() {
  try { $('#user').textContent = 'Agente: ' + (await api('api/auth/me')).nome; }
  catch (e) { return location.href = 'login.html'; }
  $('#sugestoes').innerHTML = SUGESTOES.map(s => `<button type="button" class="chip" style="--c:${s[1]}" onclick="sugerir('${s[0]}','${s[1]}')">${s[0]}</button>`).join('');
  carregar();
}

async function carregar() {
  try { [jogos, cats] = await Promise.all([api('api/jogos'), api('api/categorias')]); }
  catch (e) { return toast(e.message, true); }
  if (filtroCat && filtroCat !== 'none' && !catPorId(parseInt(filtroCat))) filtroCat = '';
  const plats = [...new Set(jogos.map(j => j.plataforma))].sort();
  const atual = $('#filtro').value;
  $('#filtro').innerHTML = '<option value="">Todas as plataformas</option>' + plats.map(p => `<option>${esc(p)}</option>`).join('');
  $('#filtro').value = plats.includes(atual) ? atual : '';
  const total = jogos.reduce((s, j) => s + j.preco, 0);
  contar($('#sTotal'), jogos.length, v => Math.round(v));
  contar($('#sValor'), total, brl);
  contar($('#sMedia'), jogos.length ? total / jogos.length : 0, brl);
  contar($('#sCats'), cats.length, v => Math.round(v));
  desenharChips(); desenharTabela(); desenharCats();
}

function desenharChips() {
  const qtd = id => jogos.filter(j => j.categoriaId === id).length;
  const sem = jogos.filter(j => j.categoriaId == null).length;
  let h = `<button class="chip ${filtroCat === '' ? 'on' : ''}" onclick="filtrar('')">Todos (${jogos.length})</button>`;
  h += cats.map(c => `<button class="chip ${filtroCat === String(c.id) ? 'on' : ''}" style="--c:${esc(c.cor)}" onclick="filtrar('${c.id}')">${esc(c.nome)} (${qtd(c.id)})</button>`).join('');
  if (sem && cats.length) h += `<button class="chip ${filtroCat === 'none' ? 'on' : ''}" onclick="filtrar('none')">Sem categoria (${sem})</button>`;
  h += `<button class="chip cfg" onclick="abrirCats()">⚙ Gerenciar categorias</button>`;
  $('#chips').innerHTML = h;
}
function filtrar(v) { filtroCat = v; desenharChips(); desenharTabela(); }

function desenharTabela() {
  const q = $('#busca').value.toLowerCase(), f = $('#filtro').value;
  const lista = jogos.filter(j => {
    const okCat = !filtroCat || (filtroCat === 'none' ? j.categoriaId == null : String(j.categoriaId) === filtroCat);
    return okCat && (!f || j.plataforma === f) && ((j.titulo || '') + ' ' + (j.genero || '')).toLowerCase().includes(q);
  });
  mostrar($('#vazio'), lista.length === 0, 'block');
  $('#corpo').innerHTML = lista.map((j, i) => {
    const c = catPorId(j.categoriaId);
    const tag = c ? `<span class="tag" style="--c:${esc(c.cor)}">${esc(c.nome)}</span>` : '<span class="mut">—</span>';
    return `<tr class="row" style="animation-delay:${i * 30}ms">
      <td><b>${esc(j.titulo)}</b></td><td>${tag}</td><td>${esc(j.plataforma)}</td>
      <td>${esc(j.genero) || '—'}</td><td>${brl(j.preco)}</td>
      <td class="act"><button title="Editar" onclick="abrir(${j.id})">✎</button><button class="del" title="Excluir" onclick="excluir(${j.id})">✕</button></td>
    </tr>`;
  }).join('');
}

/* ---------- jogos ---------- */
function abrir(id) {
  editJogo = id || null;
  const j = jogos.find(x => x.id === id) || { titulo: '', plataforma: '', genero: '', preco: '', categoriaId: null };
  $('#mTitulo').textContent = id ? 'Editar registro' : 'Novo registro';
  $('#fCat').innerHTML = '<option value="">Sem categoria</option>' + cats.map(c => `<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  $('#fCat').value = j.categoriaId == null ? '' : String(j.categoriaId);
  $('#fTitulo').value = j.titulo; $('#fPlat').value = j.plataforma; $('#fGen').value = j.genero || ''; $('#fPreco').value = j.preco;
  mostrar($('#modal'), true); $('#fTitulo').focus();
}
const fechar = () => mostrar($('#modal'), false);

async function excluir(id) {
  const j = jogos.find(x => x.id === id);
  if (!confirm(`Excluir "${j.titulo}"?`)) return;
  try { await api('api/jogos/' + id, 'DELETE'); toast('Registro excluído'); carregar(); }
  catch (e) { toast(e.message, true); }
}

$('#form').onsubmit = async e => {
  e.preventDefault();
  const dados = {
    titulo: $('#fTitulo').value, plataforma: $('#fPlat').value, genero: $('#fGen').value,
    preco: parseFloat($('#fPreco').value), categoriaId: $('#fCat').value ? parseInt($('#fCat').value) : null
  };
  try {
    await api(editJogo ? 'api/jogos/' + editJogo : 'api/jogos', editJogo ? 'PUT' : 'POST', dados);
    toast(editJogo ? 'Registro atualizado!' : 'Registro criado!');
    fechar(); carregar();
  } catch (err) { toast(err.message, true); }
};

/* ---------- categorias ---------- */
function abrirCats() { resetCat(); desenharCats(); mostrar($('#modalCats'), true); }
const fecharCats = () => mostrar($('#modalCats'), false);
function resetCat() { editCat = null; $('#cNome').value = ''; $('#cCor').value = '#c1121f'; $('#cBtn').textContent = 'Criar categoria'; }
function sugerir(nome, cor) { $('#cNome').value = nome; $('#cCor').value = cor; }

function desenharCats() {
  $('#listaCats').innerHTML = cats.length ? cats.map(c => `
    <div class="catrow" style="--c:${esc(c.cor)}"><span class="dot"></span><b>${esc(c.nome)}</b>
      <span class="mut" style="font-size:12px">${jogos.filter(j => j.categoriaId === c.id).length} jogos</span>
      <span class="act"><button title="Editar" onclick="editarCat(${c.id})">✎</button><button class="del" title="Excluir" onclick="excluirCat(${c.id})">✕</button></span>
    </div>`).join('') : '<p class="mut" style="font-size:13px">Nenhuma categoria ainda. Crie a primeira abaixo.</p>';
}
function editarCat(id) {
  const c = catPorId(id); editCat = id;
  $('#cNome').value = c.nome; $('#cCor').value = c.cor; $('#cBtn').textContent = 'Salvar categoria'; $('#cNome').focus();
}
async function excluirCat(id) {
  const c = catPorId(id);
  if (!confirm(`Excluir a categoria "${c.nome}"? Os jogos dela ficarão sem categoria.`)) return;
  try { await api('api/categorias/' + id, 'DELETE'); toast('Categoria excluída'); resetCat(); carregar(); }
  catch (e) { toast(e.message, true); }
}
$('#formCat').onsubmit = async e => {
  e.preventDefault();
  const dados = { nome: $('#cNome').value, cor: $('#cCor').value };
  try {
    if (editCat) { await api('api/categorias/' + editCat, 'PUT', dados); toast('Categoria atualizada!'); }
    else { await api('api/categorias', 'POST', dados); toast('Categoria criada!'); }
    resetCat(); carregar();
  } catch (err) { toast(err.message, true); }
};

/* ---------- eventos gerais ---------- */
$('#novo').onclick = () => abrir();
$('#cancelar').onclick = fechar;
$('#fecharCats').onclick = fecharCats;
$('#modal').onclick = e => { if (e.target.id === 'modal') fechar(); };
$('#modalCats').onclick = e => { if (e.target.id === 'modalCats') fecharCats(); };
document.onkeydown = e => { if (e.key === 'Escape') { fechar(); fecharCats(); } };
$('#busca').oninput = desenharTabela; $('#filtro').onchange = desenharTabela;
$('#sair').onclick = async () => { await api('api/auth/logout', 'POST').catch(() => {}); location.href = 'login.html'; };
iniciar();
</script>
</body>
</html>
